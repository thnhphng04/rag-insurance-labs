# Vector store cho Lab 3+. Port 5433 để không đụng Postgres nội bộ của LangFuse (infra/langfuse).
services:
  pgvector:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ragbv
      POSTGRES_PASSWORD: ragbv
      POSTGRES_DB: ragbv
    ports:
      - 127.0.0.1:5433:5432
    volumes:
      - ragbv_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ragbv"]
      interval: 3s
      retries: 10

volumes:
  ragbv_pg_data:
